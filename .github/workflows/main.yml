
name: Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build LocalVideoStudio
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Build debug APK
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          elif [ -f ./gradle/wrapper/gradle-wrapper.properties ]; then
            echo "Gradle wrapper files are incomplete."
            exit 1
          else
            echo "Gradle wrapper is missing. Add gradlew and gradle/wrapper files."
            exit 1
          fi

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LocalVideoStudio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
